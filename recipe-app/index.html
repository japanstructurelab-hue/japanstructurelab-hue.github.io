<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康食×時短 | 社内レシピ集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f4ec;
    --surface: #ffffff;
    --surface-2: #eef0e4;
    --text: #232821;
    --text-soft: #5b6156;
    --green: #4b6b3a;
    --green-deep: #364e28;
    --amber: #c98a3e;
    --amber-soft: #f3e2c8;
    --line: #ddd9c8;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  img{ max-width:100%; display:block; }

  .wrap{ max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  header.hero{
    position: relative;
    padding: 64px 0 48px;
    background:
      radial-gradient(circle at 12% 20%, rgba(75,107,58,0.10), transparent 45%),
      radial-gradient(circle at 88% 0%, rgba(201,138,62,0.12), transparent 40%);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size: 12.5px;
    letter-spacing: .14em;
    color: var(--green-deep);
    background: var(--amber-soft);
    border: 1px solid rgba(75,107,58,0.18);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .eyebrow::before{ content:"●"; color: var(--amber); font-size: 8px; }

  h1.catch{
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: clamp(34px, 6vw, 56px);
    letter-spacing: .02em;
    margin: 0 0 18px;
    color: var(--green-deep);
  }
  h1.catch .x{ color: var(--amber); font-weight: 500; padding: 0 6px; }

  p.sub{
    font-size: 16.5px;
    color: var(--text-soft);
    margin: 0 0 30px;
    max-width: 480px;
  }

  .hero-stats{
    display:flex;
    gap: 28px;
    flex-wrap: wrap;
    font-size: 13.5px;
    color: var(--text-soft);
  }
  .hero-stats b{
    display:block;
    font-family:"Shippori Mincho", serif;
    font-size: 22px;
    color: var(--green-deep);
    font-weight:700;
  }

  /* ---------- Filter bar ---------- */
  .filter-bar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,244,236,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 16px 0;
  }
  .filter-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items:center;
  }
  .filter-label{
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: .06em;
    margin-right: 4px;
    white-space: nowrap;
  }
  .chip{
    appearance:none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .chip:hover{ border-color: var(--green); }
  .chip.active{
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .filter-divider{
    width:1px;
    align-self: stretch;
    background: var(--line);
    margin: 0 4px;
  }

  /* ---------- Grid ---------- */
  main{ padding: 40px 0 80px; }

  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin: 0 0 20px;
  }
  .section-title h2{
    font-family:"Shippori Mincho", serif;
    font-size: 21px;
    margin:0;
    color: var(--green-deep);
  }
  .section-title span{
    font-size: 13px;
    color: var(--text-soft);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(35,40,33,0.08);
  }

  .card-media{
    height: 150px;
    background:
      linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    background-size: cover;
    background-position: center;
    position:relative;
    display:flex;
    align-items:flex-end;
    padding: 12px;
  }
  .card-media.has-image::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(0,0,0,0.45), rgba(0,0,0,0) 55%);
  }
  .card-media .genre-tag{ position:relative; z-index:1; }
  .card-media .genre-tag{
    font-size: 11.5px;
    color: #fff;
    background: rgba(0,0,0,0.28);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: .04em;
  }
  .card-media .no-image{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    letter-spacing: .1em;
  }

  .card-body{
    padding: 16px 18px 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    flex: 1;
  }
  .card-body h3{
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
    margin: 0;
    color: var(--text);
  }
  .card-time{
    font-size: 12.5px;
    color: var(--amber);
    font-weight: 500;
  }
  .card-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top: auto;
    padding-top: 6px;
  }
  .tag-pill{
    font-size: 11px;
    color: var(--green-deep);
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 999px;
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-soft);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty-state .mark{
    font-family:"Shippori Mincho", serif;
    font-size: 28px;
    color: var(--green-deep);
    display:block;
    margin-bottom: 10px;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    display:none;
    position: fixed; inset:0;
    background: rgba(35,40,33,0.45);
    z-index: 50;
    padding: 30px 16px;
    overflow-y: auto;
  }
  .modal-backdrop.open{ display:block; }
  .modal{
    max-width: 600px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 18px;
    overflow:hidden;
  }
  .modal-media{
    height: 220px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    background-size: cover;
    background-position: center;
    position:relative;
  }

  /* ---------- 人数セレクター ---------- */
  .servings-box{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 4px 0 18px;
    padding: 12px 16px;
    background: var(--surface-2);
    border-radius: 10px;
  }
  .servings-box .label{
    font-size: 13px;
    color: var(--text-soft);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .stepper button{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 16px;
    line-height:1;
    cursor:pointer;
    color: var(--green-deep);
  }
  .stepper button:hover{ border-color: var(--green); }
  .stepper .count{
    font-family:"Shippori Mincho", serif;
    font-size: 17px;
    min-width: 44px;
    text-align:center;
  }
  .scale-note{
    font-size: 12px;
    color: var(--amber);
    margin-left: auto;
    display:none;
  }
  .scale-note.show{ display:block; }
  .modal-close{
    position:absolute;
    top:14px; right:14px;
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background: rgba(0,0,0,0.35);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .modal-body{ padding: 26px 28px 34px; }
  .modal-body h2{
    font-family:"Shippori Mincho", serif;
    font-size: 26px;
    margin: 0 0 6px;
    color: var(--green-deep);
  }
  .modal-meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom: 18px;
  }
  .modal-body h4{
    font-size: 13px;
    letter-spacing:.08em;
    color: var(--amber);
    margin: 26px 0 10px;
  }
  .modal-body ul, .modal-body ol{
    margin:0; padding-left: 20px;
    font-size: 14.5px;
  }
  .modal-body li{ margin-bottom: 6px; }
  .tip-box{
    margin-top: 22px;
    background: var(--amber-soft);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
    color: var(--green-deep);
  }

  footer{
    border-top: 1px solid var(--line);
    padding: 26px 0;
    text-align:center;
    font-size: 12.5px;
    color: var(--text-soft);
  }
  footer .privacy-note{
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-soft);
    opacity: 0.75;
  }
  .hero-privacy-note{
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--green-deep);
    background: var(--surface);
    border: 1px solid rgba(75,107,58,0.25);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .hero-privacy-note::before{ content: "🔒"; font-size: 11px; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">社内健康改善提案 &nbsp;PILOT</div>
    <h1 class="catch">健康食<span class="x">×</span>時短</h1>
    <p class="sub">手間をかけずに、体が整うレシピ。加工食品・精製糖・揚げ物油を控えた、家庭料理ベースの時短レシピを集めています。</p>
    <div class="hero-stats">
      <div><b id="stat-count">–</b>掲載レシピ</div>
      <div><b>6ヶ月</b>で100品を目標</div>
      <div><b>誰でも</b>投稿できます</div>
    </div>
    <div class="hero-privacy-note">投稿フォームでは、メールアドレスなどの個人情報は一切収集していません。</div>
  </div>
</header>

<div class="filter-bar">
  <div class="wrap filter-row">
    <span class="filter-label">ジャンル</span>
    <button class="chip active" data-filter-type="genre" data-value="all">すべて</button>
    <button class="chip" data-filter-type="genre" data-value="主菜(肉)">主菜(肉)</button>
    <button class="chip" data-filter-type="genre" data-value="主菜(魚)">主菜(魚)</button>
    <button class="chip" data-filter-type="genre" data-value="副菜">副菜</button>
    <button class="chip" data-filter-type="genre" data-value="汁物">汁物</button>
    <button class="chip" data-filter-type="genre" data-value="作り置き">作り置き</button>
    <button class="chip" data-filter-type="genre" data-value="おやつ">ちょっと甘いもの</button>

    <span class="filter-divider"></span>

    <span class="filter-label">時短</span>
    <button class="chip active" data-filter-type="time" data-value="all">すべて</button>
    <button class="chip" data-filter-type="time" data-value="15">15分以内</button>
    <button class="chip" data-filter-type="time" data-value="30">30分以内</button>

    <span class="filter-divider"></span>

    <span class="filter-label">こだわり</span>
    <button class="chip" data-filter-type="tag" data-value="揚げない">揚げない</button>
    <button class="chip" data-filter-type="tag" data-value="精製糖控えめ">精製糖控えめ</button>
    <button class="chip" data-filter-type="tag" data-value="加工食品控えめ">加工食品控えめ</button>
  </div>
</div>

<main class="wrap">
  <div class="section-title">
    <h2>レシピ一覧</h2>
    <span id="result-count"></span>
  </div>
  <div class="grid" id="recipe-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <span class="mark">◯</span>
    条件に合うレシピがまだありません。<br>条件を変えて探してみてください。
  </div>
</main>

<footer>
  <div class="wrap">健康食×時短 プロジェクト — 社員のみなさんの投稿でレシピは増えていきます</div>
</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-media">
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* レシピデータは recipes.json から起動時に読み込む */
let RECIPES = [];

async function loadRecipes(){
  try{
    const res = await fetch("recipes.json");
    RECIPES = await res.json();
  }catch(e){
    console.error("recipes.json の読み込みに失敗しました", e);
    RECIPES = [];
  }
  document.getElementById("stat-count").textContent = RECIPES.length;
  render();
}

/* ---------- 状態 ---------- */
let activeGenre = "all";
let activeTime = "all";
let activeTags = new Set();

/* ---------- 描画 ---------- */
const grid = document.getElementById("recipe-grid");
const emptyState = document.getElementById("empty-state");
const resultCount = document.getElementById("result-count");

function timeLabel(min){
  if(min <= 15) return "15分以内";
  if(min <= 30) return "30分以内";
  return "30分以上";
}

function matches(recipe){
  if(activeGenre !== "all" && recipe.genre !== activeGenre) return false;
  if(activeTime !== "all"){
    const max = parseInt(activeTime, 10);
    if(recipe.time > max) return false;
  }
  for(const t of activeTags){
    if(!recipe.tags.includes(t)) return false;
  }
  return true;
}

function render(){
  const list = RECIPES.filter(matches);
  grid.innerHTML = "";
  resultCount.textContent = list.length + " 品";
  emptyState.style.display = list.length === 0 ? "block" : "none";

  list.forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    const mediaStyle = r.image ? ` style="background-image:url('${r.image}')"` : "";
    card.innerHTML = `
      <div class="card-media${r.image ? " has-image" : ""}"${mediaStyle}>
        ${r.image ? "" : '<span class="no-image">写真準備中</span>'}
        <span class="genre-tag">${r.genre}</span>
      </div>
      <div class="card-body">
        <h3>${r.name}</h3>
        <div class="card-time">${timeLabel(r.time)}</div>
        <div class="card-tags">
          ${r.tags.map(t => `<span class="tag-pill">${t}</span>`).join("")}
        </div>
      </div>
    `;
    card.addEventListener("click", () => openModal(r));
    grid.appendChild(card);
  });
}

/* ---------- フィルター操作 ---------- */
document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.filterType;
    const value = btn.dataset.value;

    if(type === "genre"){
      document.querySelectorAll('[data-filter-type="genre"]').forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeGenre = value;
    }
    if(type === "time"){
      document.querySelectorAll('[data-filter-type="time"]').forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeTime = value;
    }
    if(type === "tag"){
      if(activeTags.has(value)){
        activeTags.delete(value);
        btn.classList.remove("active");
      }else{
        activeTags.add(value);
        btn.classList.add("active");
      }
    }
    render();
  });
});

/* ---------- モーダル ---------- */
const modalBackdrop = document.getElementById("modal-backdrop");
const modalBody = document.getElementById("modal-body");
const modalMedia = document.querySelector(".modal-media");
let currentRecipe = null;
let currentServings = 2;

// 分数表記が自然な「数え単位」。本・個などは常に分数対象。
const COUNT_UNITS = new Set(["本","個","枚","束","玉","片","缶","袋","パック","切れ","丁","尾"]);
// 大さじ・小さじは「1未満の時だけ」分数表記が自然(例:小さじ1/3)。1以上は小数のままが普通(例:大さじ1.5)。
const SPOON_UNITS = new Set(["大さじ", "小さじ"]);

// 小数(0〜1未満)に最も近い、料理で自然に使う分数(分母2,3,4,5,6,8)を探す
const ALLOWED_DENOMS = [2, 3, 4, 5, 6, 8];
function bestFraction(frac){
  let best = { num: 0, den: 1, err: frac };
  for(const den of ALLOWED_DENOMS){
    const num = Math.round(frac * den);
    if(num === 0 || num === den) continue; // 0や1(整数)になるものは対象外
    const err = Math.abs(frac - num / den);
    if(err < best.err){
      const g = gcd(num, den);
      best = { num: num / g, den: den / g, err };
    }
  }
  return best;
}
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }

function formatAmount(n, unit){
  if(n === null) return "";
  const rounded = Math.round(n * 1000) / 1000;
  if(Number.isInteger(rounded)) return String(rounded);

  // 0.99や3.02のような「実質整数」に近い値は、無理に分数/小数にせず丸める
  const nearestInt = Math.round(rounded);
  if(Math.abs(rounded - nearestInt) < 0.03){
    return String(nearestInt);
  }

  const whole = Math.floor(rounded);
  const isFractionEligible = (unit && COUNT_UNITS.has(unit)) || (unit && SPOON_UNITS.has(unit) && whole === 0);
  if(isFractionEligible){
    const frac = rounded - whole;
    const best = bestFraction(frac);
    // 分数として十分近ければ分数表記、そうでなければ小数にフォールバック
    if(best.err < 0.04){
      const label = `${best.num}/${best.den}`;
      return whole > 0 ? `${whole}と${label}` : label;
    }
  }
  // 計量単位、または該当する分数がない場合は小数のまま(丸めて見やすく)
  return String(Math.round(rounded * 100) / 100);
}

// 「小さじ」「大さじ」は日本語の慣習上、数字の前に単位が来る(例:小さじ1)。
// それ以外(本・個・g・mlなど)は数字の後に単位が来る(例:2本、150g)。
const PREFIX_UNITS = new Set(["大さじ", "小さじ"]);

function formatQuantity(amount, unit){
  const num = formatAmount(amount, unit);
  if(PREFIX_UNITS.has(unit)){
    return `${unit}${num}`;
  }
  return `${num}${unit}`;
}

function ingredientLine(ing, servings, base){
  if(ing.amount === null){
    // 「こしょう 少々」のように分量を持たないもの
    return ing.name;
  }
  if(!ing.scalable){
    const changed = servings !== base;
    return `${ing.name} ${formatQuantity(ing.amount, ing.unit)}${changed ? "(お好みで調整)" : ""}`;
  }
  const scaled = ing.amount * (servings / base);
  return `${ing.name} ${formatQuantity(scaled, ing.unit)}`;
}

function renderModalIngredients(){
  const r = currentRecipe;
  const list = document.getElementById("modal-ingredient-list");
  list.innerHTML = r.ingredients.map(i => `<li>${ingredientLine(i, currentServings, r.baseServings)}</li>`).join("");

  const note = document.getElementById("scale-note");
  const hasScaled = currentServings !== r.baseServings && r.ingredients.some(i => i.scalable);
  note.classList.toggle("show", hasScaled);

  document.getElementById("servings-count").textContent = currentServings + "人前";
}

function openModal(r){
  currentRecipe = r;
  currentServings = r.baseServings;

  modalMedia.style.backgroundImage = r.image ? `url('${r.image}')` : "";

  modalBody.innerHTML = `
    <h2>${r.name}</h2>
    <div class="modal-meta">
      <span class="tag-pill">${timeLabel(r.time)}</span>
      ${r.tags.map(t => `<span class="tag-pill">${t}</span>`).join("")}
    </div>

    <div class="servings-box">
      <span class="label">人数</span>
      <div class="stepper">
        <button id="servings-minus" aria-label="人数を減らす">−</button>
        <span class="count" id="servings-count">${currentServings}人前</span>
        <button id="servings-plus" aria-label="人数を増やす">＋</button>
      </div>
      <span class="scale-note" id="scale-note">塩・こしょうなどは目安です。味を見て調整してください。</span>
    </div>

    <h4>材料</h4>
    <ul id="modal-ingredient-list"></ul>
    <h4>作り方</h4>
    <ol>${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    ${r.tip ? `<div class="tip-box">${r.tip}</div>` : ""}
  `;

  renderModalIngredients();

  document.getElementById("servings-minus").addEventListener("click", () => {
    if(currentServings > 1){
      currentServings -= 1;
      renderModalIngredients();
    }
  });
  document.getElementById("servings-plus").addEventListener("click", () => {
    if(currentServings < 10){
      currentServings += 1;
      renderModalIngredients();
    }
  });

  modalBackdrop.classList.add("open");
}
document.getElementById("modal-close").addEventListener("click", () => {
  modalBackdrop.classList.remove("open");
});
modalBackdrop.addEventListener("click", (e) => {
  if(e.target === modalBackdrop) modalBackdrop.classList.remove("open");
});

loadRecipes();
</script>

</body>
</html>
