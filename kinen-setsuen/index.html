<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禁煙カウンター｜社内健康改善提案</title>
<style>
  :root{
    --surface: #ffffff;
    --surface-2: #eef0e4;
    --bg: #faf8f2;
    --text: #2b2f26;
    --text-soft: #5b6156;
    --green-deep: #364e28;
    --green-soft: #5c7a45;
    --amber-soft: #f3e2c8;
    --gold: #b8892b;
    --line: #ddd9c8;
    --danger: #a4432f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--surface);
    box-shadow:0 0 40px rgba(0,0,0,0.04);
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--amber-soft);
    color:var(--green-deep);
    font-size:11px;
    font-weight:600;
    padding:5px 12px;
    border-radius:999px;
    letter-spacing:.02em;
  }
  header.top{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-size:21px;
    margin:8px 0 4px;
    letter-spacing:.01em;
  }
  .sub{
    color:var(--text-soft);
    font-size:12px;
    line-height:1.55;
    margin:0;
  }

  .screen{ display:none; padding:18px 20px 28px; }
  .screen.active{ display:block; }

  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text-soft);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    background:var(--bg);
    color:var(--text);
  }
  .field input:focus{ outline:2px solid var(--green-soft); outline-offset:1px; }
  .field .hint{ font-size:11.5px; color:var(--text-soft); margin-top:5px; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--green-deep);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }
  .btn:hover{ opacity:.9; }
  .btn.secondary{
    background:transparent;
    color:var(--text-soft);
    border:1px solid var(--line);
    font-weight:600;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--green-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    font:inherit;
  }

  .counter-hero{
    text-align:center;
    padding:6px 0 4px;
  }
  .counter-hero .label{
    font-size:11.5px;
    color:var(--text-soft);
    letter-spacing:.05em;
  }
  .time-display{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:10px 0 4px;
    flex-wrap:wrap;
  }
  .time-unit{
    background:var(--surface-2);
    border-radius:12px;
    padding:9px 8px;
    min-width:56px;
  }
  .time-unit .num{
    font-size:23px;
    font-weight:800;
    color:var(--green-deep);
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  .time-unit .unit{
    font-size:10px;
    color:var(--text-soft);
    margin-top:3px;
  }

  .savings-card{
    margin-top:16px;
    background:linear-gradient(135deg, var(--green-deep), #24371a);
    border-radius:16px;
    padding:16px 18px;
    color:#fff;
    text-align:center;
  }
  .savings-card .label{
    font-size:11.5px;
    opacity:.85;
    letter-spacing:.04em;
  }
  .savings-card .amount{
    font-size:30px;
    font-weight:800;
    margin-top:5px;
    font-variant-numeric: tabular-nums;
    color:#f6e6b8;
    letter-spacing:.01em;
  }
  .savings-card .sub{
    font-size:11px;
    opacity:.8;
    margin-top:4px;
    color:#fff;
  }

  .stat-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
  }
  .stat-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .stat-box .n{ font-size:17px; font-weight:800; color:var(--green-deep); }
  .stat-box .t{ font-size:10.5px; color:var(--text-soft); margin-top:2px; }

  footer.foot{
    padding:14px 20px 22px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(43,47,38,0.45);
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-box{
    background:var(--surface);
    border-radius:18px;
    padding:24px 22px;
    max-width:340px;
    width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,0.18);
  }
  .modal-msg{
    font-size:14.5px;
    line-height:1.7;
    color:var(--text);
    margin:0 0 18px;
  }
  .modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .modal-actions .btn{ margin-top:0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="badge">● 社内健康改善提案 PILOT</span>
    <h1>禁煙カウンター</h1>
    <p class="sub">吸わなかった時間と、浮いた金額を見える化します。<button class="link-btn" id="sub-toggle" onclick="toggleSub()" style="font-size:12px;">詳しく見る</button></p>
    <p class="sub" id="sub-detail" style="display:none; margin-top:6px;">値段はすべてあなたが入力した数字だけを使い、どこにも送信・保存されません（この端末のブラウザ内だけに残ります）。</p>
  </header>

  <!-- 画面1：初期設定 -->
  <section id="screen-setup" class="screen">
    <div class="field">
      <label>1箱の値段（円）</label>
      <input type="number" id="set-price" inputmode="numeric" placeholder="例：600" min="300" step="10">
    </div>
    <div class="field">
      <label>1箱の本数</label>
      <input type="number" id="set-perbox" inputmode="numeric" placeholder="例：20" min="1" step="1">
    </div>
    <div class="field">
      <label>禁煙前、1日に吸っていた本数</label>
      <input type="number" id="set-daily" inputmode="numeric" placeholder="例：10" min="1" step="1">
      <div class="hint">この本数をもとに、吸わずに済んだ本数と節約額を計算します。</div>
    </div>
    <button class="btn" onclick="saveSetup()">この内容で始める</button>
  </section>

  <!-- 画面2：メイン -->
  <section id="screen-quit" class="screen">
    <div class="counter-hero">
      <div id="mascot-box" style="text-align:center; margin-bottom:6px;"></div>
      <div class="label">最後に吸ってから</div>
      <div class="time-display">
        <div class="time-unit"><div class="num" id="q-days">0</div><div class="unit">日</div></div>
        <div class="time-unit"><div class="num" id="q-hours">00</div><div class="unit">時間</div></div>
        <div class="time-unit"><div class="num" id="q-mins">00</div><div class="unit">分</div></div>
        <div class="time-unit"><div class="num" id="q-secs">00</div><div class="unit">秒</div></div>
      </div>
    </div>

    <div class="savings-card">
      <div class="label">節約できた金額</div>
      <div class="amount">¥<span id="q-savings">0</span></div>
      <div class="sub" id="q-count-avoided">吸わずに済んだ本数：0本</div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="n" id="q-perday">¥0</div><div class="t">1日あたりの節約</div></div>
      <div class="stat-box"><div class="n" id="q-startdate">-</div><div class="t">禁煙開始日</div></div>
    </div>

    <button class="btn" style="margin-top:16px; background:var(--danger);" onclick="smokedAgain()">また吸ってしまった（時計だけリセット）</button>
    <button class="btn secondary" style="margin-top:8px;" onclick="resetAll()">設定をリセットする</button>
  </section>

  <div id="confirm-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="confirm-message" class="modal-msg"></p>
      <div class="modal-actions">
        <button class="btn secondary" id="confirm-cancel">キャンセル</button>
        <button class="btn" id="confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="celebrate-overlay" class="modal-overlay">
    <div class="modal-box" style="text-align:center;">
      <div id="celebrate-mascot" style="margin-bottom:4px;"></div>
      <div style="font-size:13px; color:var(--text-soft); margin-top:10px;" id="celebrate-stage">若木まで育ちました</div>
      <div style="font-size:18px; font-weight:800; color:var(--green-deep); margin-top:4px;" id="celebrate-title">達成です</div>
      <div style="font-size:12px; color:var(--text-soft); margin-top:10px; line-height:1.6;">ここまでの節約額は<br><span style="color:var(--gold); font-weight:700;" id="celebrate-amount">¥0</span>です</div>
      <button class="btn" style="margin-top:18px;" id="celebrate-close">閉じる</button>
    </div>
  </div>

</div>

<script>
const KEY = 'quitSmokingData_v2';

function toggleSub(){
  const detail = document.getElementById('sub-detail');
  const btn = document.getElementById('sub-toggle');
  const isHidden = detail.style.display === 'none';
  detail.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '閉じる' : '詳しく見る';
}

const STAGES = [
  { id:'seed', minDays:0, name:'種' },
  { id:'sprout', minDays:3, name:'芽' },
  { id:'sapling', minDays:14, name:'若木' },
  { id:'bloom', minDays:30, name:'開花' }
];

function mascotSvg(stageId){
  const pot = '<rect x="50" y="150" width="40" height="30" rx="3" fill="#b8892b"/><rect x="46" y="146" width="48" height="10" rx="3" fill="#a5762a"/><ellipse cx="70" cy="150" rx="19" ry="5" fill="#3d2d1f"/>';
  const svgs = {
    seed: pot + '<circle cx="70" cy="144" r="5" fill="#8a6a3f"/>',
    sprout: pot + '<path d="M70,148 L70,120" stroke="#4a6b34" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M70,128 Q52,120 58,105 Q78,112 70,128 Z" fill="#5c7a45"/><path d="M70,122 Q88,116 84,100 Q64,105 70,122 Z" fill="#5c7a45"/>',
    sapling: pot + '<path d="M70,150 L70,90" stroke="#4a6b34" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M70,120 Q40,112 48,88 Q78,96 70,120 Z" fill="#5c7a45"/><path d="M70,110 Q100,100 94,76 Q64,86 70,110 Z" fill="#364e28"/><path d="M70,100 Q44,92 50,68 Q78,78 70,100 Z" fill="#5c7a45"/>',
    bloom: pot + '<path d="M70,150 L70,80" stroke="#4a6b34" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M70,120 Q38,112 46,86 Q78,94 70,120 Z" fill="#5c7a45"/><path d="M70,108 Q102,98 96,72 Q64,82 70,108 Z" fill="#364e28"/><path d="M70,96 Q42,88 48,62 Q78,72 70,96 Z" fill="#5c7a45"/><g transform="translate(70,70)"><circle cx="0" cy="-10" r="7" fill="#f2c14e"/><circle cx="9" cy="-3" r="7" fill="#f2c14e"/><circle cx="6" cy="8" r="7" fill="#f2c14e"/><circle cx="-6" cy="8" r="7" fill="#f2c14e"/><circle cx="-9" cy="-3" r="7" fill="#f2c14e"/><circle cx="0" cy="0" r="6" fill="#b8892b"/></g>'
  };
  return '<svg width="56" height="70" viewBox="0 0 140 200">' + svgs[stageId] + '</svg>';
}

function stageForDays(days){
  let current = STAGES[0];
  for(const s of STAGES){ if(days >= s.minDays) current = s; }
  return current;
}

function showCelebration(stage, savingsYen){
  document.getElementById('celebrate-mascot').innerHTML = mascotSvg(stage.id);
  document.getElementById('celebrate-stage').textContent = stage.name + 'まで育ちました';
  document.getElementById('celebrate-title').textContent = '達成です';
  document.getElementById('celebrate-amount').textContent = '¥' + Math.floor(savingsYen).toLocaleString();
  document.getElementById('celebrate-overlay').classList.add('active');
}
document.addEventListener('DOMContentLoaded', function(){
  const btn = document.getElementById('celebrate-close');
  if(btn) btn.addEventListener('click', function(){
    document.getElementById('celebrate-overlay').classList.remove('active');
  });
});

function showConfirm(message, onOk){
  const overlay = document.getElementById('confirm-overlay');
  document.getElementById('confirm-message').textContent = message;
  overlay.classList.add('active');
  const okBtn = document.getElementById('confirm-ok');
  const cancelBtn = document.getElementById('confirm-cancel');
  function cleanup(){
    overlay.classList.remove('active');
    okBtn.removeEventListener('click', onOkClick);
    cancelBtn.removeEventListener('click', onCancelClick);
  }
  function onOkClick(){ cleanup(); onOk(); }
  function onCancelClick(){ cleanup(); }
  okBtn.addEventListener('click', onOkClick);
  cancelBtn.addEventListener('click', onCancelClick);
}

function showAlert(message){
  const overlay = document.getElementById('confirm-overlay');
  document.getElementById('confirm-message').textContent = message;
  overlay.classList.add('active');
  const okBtn = document.getElementById('confirm-ok');
  const cancelBtn = document.getElementById('confirm-cancel');
  cancelBtn.style.display = 'none';
  okBtn.style.gridColumn = '1 / 3';
  function cleanup(){
    overlay.classList.remove('active');
    okBtn.removeEventListener('click', onOkClick);
    cancelBtn.style.display = '';
    okBtn.style.gridColumn = '';
  }
  function onOkClick(){ cleanup(); }
  okBtn.addEventListener('click', onOkClick);
}

function loadData(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveData(data){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function saveSetup(){
  const price = parseFloat(document.getElementById('set-price').value);
  const perbox = parseFloat(document.getElementById('set-perbox').value);
  const daily = parseFloat(document.getElementById('set-daily').value);
  if(!price || !perbox || !daily || price<=0 || perbox<=0 || daily<=0){
    showAlert('すべての項目に、0より大きい数字を入力してください。');
    return;
  }
  const data = { price, perbox, daily, startedAt: Date.now() };
  saveData(data);
  render();
}

function smokedAgain(){
  showConfirm('経過時間と節約額の時計を0からやり直します。値段などの設定はそのまま残ります。よろしいですか？', function(){
    const data = loadData();
    if(data){
      data.startedAt = Date.now();
      data.lastCelebratedStage = null;
      saveData(data);
      render();
    }
  });
}

function resetAll(){
  showConfirm('保存されている設定と記録をすべて消去します。よろしいですか？', function(){
    localStorage.removeItem(KEY);
    showScreen('screen-setup');
  });
}

function pricePerCig(data){ return data.price / data.perbox; }
function pad(n){ return String(n).padStart(2,'0'); }

let tickTimer = null;

function renderQuit(data){
  showScreen('screen-quit');
  const perCig = pricePerCig(data);
  const perDayYen = Math.round(perCig * data.daily);
  document.getElementById('q-perday').textContent = '¥' + perDayYen.toLocaleString();
  const started = new Date(data.startedAt);
  document.getElementById('q-startdate').textContent =
    (started.getMonth()+1) + '/' + started.getDate();

  let lastStageId = data.lastCelebratedStage || null;

  function tick(){
    const elapsedMs = Date.now() - data.startedAt;
    const elapsedSec = Math.max(0, Math.floor(elapsedMs/1000));
    const days = Math.floor(elapsedSec / 86400);
    const hours = Math.floor((elapsedSec % 86400) / 3600);
    const mins = Math.floor((elapsedSec % 3600) / 60);
    const secs = elapsedSec % 60;
    document.getElementById('q-days').textContent = days;
    document.getElementById('q-hours').textContent = pad(hours);
    document.getElementById('q-mins').textContent = pad(mins);
    document.getElementById('q-secs').textContent = pad(secs);

    const elapsedDaysFloat = elapsedSec / 86400;
    const avoidedCigs = elapsedDaysFloat * data.daily;
    const savings = avoidedCigs * perCig;
    document.getElementById('q-savings').textContent = Math.floor(savings).toLocaleString();
    document.getElementById('q-count-avoided').textContent =
      '吸わずに済んだ本数：約' + Math.floor(avoidedCigs) + '本';

    const stage = stageForDays(days);
    document.getElementById('mascot-box').innerHTML = mascotSvg(stage.id);

    if(stage.id !== lastStageId){
      if(lastStageId !== null){
        showCelebration(stage, savings);
      }
      lastStageId = stage.id;
      data.lastCelebratedStage = stage.id;
      saveData(data);
    }
  }
  tick();
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, 1000);
}

function render(){
  const data = loadData();
  if(!data){
    showScreen('screen-setup');
    return;
  }
  renderQuit(data);
}

render();
</script>
</body>
</html>
